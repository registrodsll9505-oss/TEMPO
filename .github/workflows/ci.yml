name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tempo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base efímera del propio job; no es un secreto.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tempo_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tempo_test
      DEMO_PASSWORD: clave-demo-solo-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas unitarias y de aislamiento entre empresas
        run: npm test
      - name: Navegador para las pruebas de extremo a extremo
        run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-e2e
          path: test-results/
          retention-days: 7
